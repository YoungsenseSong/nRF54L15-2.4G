CONFIG_SERIAL=y
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_PRINTK=n
CONFIG_STDOUT_CONSOLE=n
CONFIG_EARLY_CONSOLE=n
CONFIG_BOOT_BANNER=n
CONFIG_NCS_BOOT_BANNER=n

# Use the non-blocking UARTE async API. On nRF this is backed by EasyDMA.
CONFIG_UART_ASYNC_API=y
CONFIG_UART_00_ASYNC=y

# The custom TX board does not rely on an external 32.768 kHz crystal.
# Match the verified gpio_demo startup clock source so CPUAPP can reach main().
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_500PPM=y

CONFIG_MBOX=y
CONFIG_IPC_SERVICE=y
CONFIG_IPC_SERVICE_BACKEND_ICMSG=y
CONFIG_ASSERT=y
CONFIG_CRC=y

CONFIG_ESB=y
CONFIG_ESB_MAX_PAYLOAD_LENGTH=224
CONFIG_ESB_TX_FIFO_SIZE=16
CONFIG_ESB_RX_FIFO_SIZE=16
CONFIG_CLOCK_CONTROL=y
CONFIG_NRFX_DPPI10=y

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_IPC_SERVICE_BACKEND_ICMSG_WQ_STACK_SIZE=4096
CONFIG_PBUF_RX_READ_BUF_SIZE=256
